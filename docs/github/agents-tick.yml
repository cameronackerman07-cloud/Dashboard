# COPY THIS FILE to .github/workflows/agents-tick.yml in GitHub's website
# (Add file → Create new file, name it .github/workflows/agents-tick.yml, paste, Commit).
# It can't be pushed from this computer because the saved GitHub token lacks the
# "workflow" permission.
#
# Runs the dashboard's AI agents every 30 minutes (GitHub may start it 5–30
# minutes late). Needs two repo secrets: SITE_URL (https://your-site) and
# AGENT_SECRET (the same value as in Vercel). Every 30 minutes uses about 1,440
# of the free 2,000 Actions minutes a month for a private repo.
name: Agents tick
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the tick endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$AGENT_SECRET" ]; then echo "Add SITE_URL and AGENT_SECRET repo secrets."; exit 0; fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $AGENT_SECRET" "$SITE_URL/api/agents/tick"
